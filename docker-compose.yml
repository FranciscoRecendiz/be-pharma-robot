version: '3.8'

services:
  n8n:
    build: .
    container_name: n8n-bepharma
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=TuPasswordFuerte123
      - GENERIC_TIMEZONE=America/Mexico_City
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PYTHONUNBUFFERED=1
      - LANGCHAIN_TRACING_V2=false
    volumes:
      - "./bp-analytics:/project"
      - "./n8n_data:/home/node/.n8n"
    restart: unless-stopped

  python:
    build: .
    container_name: python-bepharma
    command: python3 /project/src/pipelines/find_companies_daily.py
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - "./bp-analytics:/project"
    depends_on:
      - n8n
    restart: unless-stopped


